<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GR | Direct Notes</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <p class="eyebrow">Яндекс.Директ</p>
          <h1>Notes</h1>
        </div>
        <div class="score" id="notesCount" title="Всего заметок">0</div>
        <div class="scope-tabs" aria-label="Фильтр логина">
          <button class="scope-tab" id="currentLoginScopeButton" type="button" data-login-scope="current">Текущий</button>
          <button class="scope-tab" id="allLoginScopeButton" type="button" data-login-scope="all">Все логины</button>
          <button class="scope-tab" id="selectedLoginScopeButton" type="button" data-login-scope="selected">Выбранный</button>
        </div>
        <select class="login-select" id="loginSelect" aria-label="Выбрать логин"></select>
        <button class="project-delete" id="deleteProjectButton" type="button" aria-label="Удалить проект" title="Удалить выбранный проект и все его заметки">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16" />
            <path d="M10 11v6" />
            <path d="M14 11v6" />
            <path d="M6 7l1 14h10l1-14" />
            <path d="M9 7V4h6v3" />
          </svg>
        </button>
      </header>

      <section class="panel">
        <div class="mode-tabs" aria-label="Тип заметки">
          <button class="mode-tab" id="campaignModeButton" type="button" data-note-type="campaign">Кампании</button>
          <button class="mode-tab" id="adgroupModeButton" type="button" data-note-type="adgroup">Группы</button>
          <button class="mode-tab" id="adModeButton" type="button" data-note-type="ad">Объявления</button>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div>
            <div class="title-row">
              <h2>Маркер на странице</h2>
              <button
                class="info-tip"
                type="button"
                aria-label="Подсказка по маркеру"
                data-tooltip="Если включено, при наведении на кампанию, группу или объявление появляется временная плашка заметки. Постоянная З видна только там, где заметка уже есть."
              >
                ?
              </button>
            </div>
            <p class="status-line" id="pageStatus">Проверяю страницу...</p>
          </div>
          <label class="switch" title="Включить или выключить маркер заметок на странице">
            <input id="enabledToggle" type="checkbox" />
            <span></span>
          </label>
        </div>
      </section>

      <section class="panel current-panel">
        <div class="panel-head">
          <div>
            <div class="title-row">
              <h2>Работа на странице</h2>
              <span class="count-pill" id="currentBadge">inline</span>
              <span class="count-pill login-pill" id="loginStatus">login</span>
            </div>
            <p class="status-line" id="currentSubtitle">Наведи на кампанию, группу или объявление: появится плашка для добавления или редактирования заметки.</p>
          </div>
          <div class="scan-actions">
            <button class="scan-action" id="scanPageButton" type="button">Скан заметок</button>
            <button class="mini-action" id="refreshButton" type="button">Обновить</button>
          </div>
        </div>
        <p class="status-line scan-status" id="scanStatus">Скан отчета еще не запускался.</p>
        <div class="option-row">
          <span>Плавающая сводка</span>
          <label class="switch small" title="Показывать счетчик уникальных заметок поверх страницы Директа">
            <input id="pageCounterToggle" type="checkbox" />
            <span></span>
          </label>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div class="title-row">
            <h2 id="notesTitle">Кампании</h2>
            <span class="count-pill" id="typeCount">0 шт.</span>
          </div>
          <div class="mini-actions">
            <button class="mini-action danger" id="clearTypeButton" type="button">Очистить</button>
          </div>
        </div>

        <div class="notes-list-shell">
          <div class="notes-list" id="notesList"></div>
        </div>
      </section>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
